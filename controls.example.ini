; Copy/edit .local/controls.ini. Changes take effect on the next launch.
[controls]
deadzone=0.12
grip_threshold=0.55
swap_hands=0
invert_left_x=0
invert_left_y=0
invert_right_x=0
invert_right_y=0

; Optional overrides use OpenXR input component paths. An empty value disables
; that binding. Keys: left/right.stick, trigger, grip, primary, secondary, click,
; axis_touch; left.menu. Other profiles have the same section format.
[bindings./interaction_profiles/oculus/touch_controller]
left.primary=/input/x/click
left.secondary=/input/y/click
right.primary=/input/a/click
right.secondary=/input/b/click
