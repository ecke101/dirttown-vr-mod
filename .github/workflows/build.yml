name: Build VR mod
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux cross compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix ninja-build libgtk-3-dev
      - run: python tools/build_vr.py
      - run: python -m unittest discover -s tests -v
      - name: Run Linux launcher checks
        if: runner.os == 'Linux'
        run: .local/vr/bin/dirttown-vr self-test
      - name: Run core checks on Windows
        if: runner.os == 'Windows'
        run: .local/vr/bin/core-test.exe
      - name: Run Windows launcher checks
        if: runner.os == 'Windows'
        run: .local/vr/bin/dirttown-vr.exe self-test
