name: Build VR mod
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux cross compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64 ninja-build
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_vr.py
      - name: Run core checks on Windows
        if: runner.os == 'Windows'
        run: .local/vr/bin/core-test.exe
